# To set up SonarCloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions

sonar.projectKey=DEFRA_aia-backend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/aia-backend
sonar.links.ci=https://github.com/DEFRA/aia-backend/actions
sonar.links.scm=https://github.com/DEFRA/aia-backend
sonar.links.issue=https://github.com/DEFRA/aia-backend/issues

# All service source roots — use app/ as single root, exclude datapipeline and test files
sonar.sources=app/
sonar.exclusions=\
  app/datapipeline/**,\
  **/__pycache__/**,\
  **/*.pyc

# All service test roots
sonar.tests=tests/
sonar.test.inclusions=\
  tests/core_backend/**,\
  tests/agent_service/**,\
  tests/orchestrator/**,\
  tests/app_root/**

sonar.cpd.exclusions=\
  app/config.py

sonar.python.version=3.14

# Do not block the pipeline on quality gate — review findings in the SonarCloud dashboard
sonar.qualitygate.wait=false

# Combined coverage report generated by scan.yml
sonar.python.coverage.reportPaths=coverage/coverage.xml
