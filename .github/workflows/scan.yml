name: Security Scan

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'schedule' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: |
          uv pip install --system -r app/core_backend/pyproject.toml
          uv pip install --system -r app/agent_service/pyproject.toml
          uv pip install --system -r app/orchestrator/pyproject.toml
          uv pip install --system --group dev -r pyproject.toml
          mkdir -p coverage

      - name: Run tests and generate combined coverage report
        run: |
          pytest tests/core_backend/ tests/orchestrator/ tests/agent_service/ tests/app_root/ \
            --cov=app \
            --cov-report=xml:coverage/coverage.xml \
            --ignore-glob='**/test_*.py' \
            -p no:cacheprovider \
            || true
          chmod -R a+rw ./coverage
        env:
          DB_HOST: localhost
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy
          JWT_SECRET: dummy-secret
          AWS_DEFAULT_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          S3_BUCKET_NAME: dummy-bucket
          ORCHESTRATOR_URL: http://localhost:8001
          ORCHESTRATOR_DEFAULT_AGENT_TYPE: general
          MAX_PRIORITY_ACTIONS: "10"
          S3_UPLOAD_PREFIX: uploaded_docs
          STATUS_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-status
          TASK_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-tasks
          LLM_PROVIDER: bedrock

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-ref: .
          scan-type: repository
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW
          limit-severities-for-sarif: true
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
