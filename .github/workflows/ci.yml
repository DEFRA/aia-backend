name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test-root:
    name: Root tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system --group dev -r pyproject.toml
          uv pip install --system -r app/orchestrator/pyproject.toml
          uv pip install --system -r app/agent_service/pyproject.toml

      - name: pytest
        run: pytest -v --tb=short tests/app_root/
        env:
          DB_HOST: localhost
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy
          AWS_DEFAULT_REGION: eu-west-2
          STATUS_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-status
          TASK_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-tasks

  test-orchestrator:
    name: Orchestrator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: app/orchestrator/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -r app/orchestrator/pyproject.toml
          uv pip install --system pytest pytest-asyncio

      - name: pytest
        run: pytest -v --tb=short tests/orchestrator/
        env:
          DB_HOST: localhost
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy
          AWS_DEFAULT_REGION: eu-west-2
          ORCHESTRATOR_DEFAULT_AGENT_TYPE: general
          MAX_PRIORITY_ACTIONS: "10"
          S3_UPLOAD_PREFIX: "uploaded_docs"
          STATUS_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-status
          TASK_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/000000000000/dummy-tasks

  test-core-backend:
    name: Core backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: app/core_backend/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -r app/core_backend/pyproject.toml
          uv pip install --system pytest pytest-asyncio pytest-mock

      - name: pytest
        run: pytest -v --tb=short tests/core_backend/
        env:
          DB_HOST: localhost
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy
          JWT_SECRET: dummy-secret
          AWS_DEFAULT_REGION: eu-west-2
          S3_BUCKET_NAME: dummy-bucket
          ORCHESTRATOR_URL: http://localhost:8001

  test-agent-service:
    name: Agent service tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: app/agent_service/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -r app/agent_service/pyproject.toml
          uv pip install --system pytest pytest-asyncio pytest-mock ruff mypy

      - name: pytest
        run: pytest -v --tb=short -x tests/agent_service/
        env:
          LLM_PROVIDER: bedrock
          AWS_DEFAULT_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DB_HOST: localhost
          DB_NAME: dummy
          DB_USER: dummy
          DB_PASSWORD: dummy