name: Generate Lock Files

on:
  workflow_dispatch:

jobs:
  generate-lock-files:
    name: Generate uv.lock files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.14.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Generate lock files
        run: |
          cd app/core_backend && uv lock && cd ../..
          cd app/agent_service && uv lock && cd ../..
          cd app/orchestrator && uv lock && cd ../..

      - name: Commit lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/core_backend/uv.lock app/agent_service/uv.lock app/orchestrator/uv.lock
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: generate uv.lock files for reproducible builds"
          git push
