[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # AWS
    "boto3>=1.34.0",
    "aiobotocore>=2.13.0",
    # LLM provider SDK
    "anthropic==0.79.0",
    # Config and validation
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "PyYAML==6.0.3",
    # Database
    "asyncpg>=0.29.0",
    # Document parsing
    "PyMuPDF>=1.24.0",
    "python-docx==1.2.0",
    # PDF report generation
    "reportlab>=4.2.0",
    # HTTP framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-json-logger>=2.0.7,<3",
]

[tool.uv]
package = false
